<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Écoutez vos stations de radio préférées en direct">
    <meta name="theme-color" content="#1a202c">
    <title>Radio en Ligne - Écoutez la radio en direct</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icone.png">
    <link rel="apple-touch-icon" href="icone.png">
    
    <!-- Préchargement des polices et ressources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Radio en Ligne">
    <meta name="apple-mobile-web-app-title" content="Radio">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col">
    <!-- En-tête du site -->
    <header class="bg-gray-100 text-gray-800 py-4 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img src="icone.png" alt="Logo Radio en Ligne" class="w-12 h-12 object-contain">
                <div>
                    <h1 class="text-2xl font-bold">Radio en Ligne</h1>
                    <p class="text-sm text-gray-600">Écoutez vos stations préférées</p>
                </div>
            </div>
            <!-- Boutons d'authentification -->
            <div class="hidden md:flex items-center space-x-4">
                <button class="px-4 py-2 text-gray-600 hover:bg-gray-100 transition-colors">
                    Se connecter
                </button>
                <button class="px-4 py-2 bg-gray-500 text-white hover:bg-gray-600 transition-colors font-medium">
                    S'inscrire
                </button>
                <!-- Badge PWA -->
                <div class="bg-white px-4 py-2">
                    <span class="text-sm text-gray-700"><i class="fas fa-broadcast-tower mr-2 text-gray-500 animate-pulse"></i>En direct</span>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 flex-col md:flex-row relative">
        <!-- Menu mobile -->
        <button id="mobile-menu-button" class="md:hidden fixed bottom-4 right-4 bg-blue-500 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center z-50">
            <i class="fas fa-list"></i>
        </button>

        <!-- Barre latérale (masquée par défaut sur mobile) -->
        <div id="sidebar" class="fixed inset-0 z-40 bg-white transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:transform-none md:w-96 md:border-r md:border-gray-200 md:overflow-y-auto">
            <!-- En-tête mobile -->
            <div class="md:hidden flex items-center justify-between p-4 border-b border-gray-100">
                <h2 class="text-xl font-semibold">Stations</h2>
                <button id="close-sidebar" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Barre de recherche -->
            <div class="sticky top-0 bg-white p-4 md:p-0 md:mb-4">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Rechercher une station..." 
                           class="w-full px-4 py-2 pr-10 border border-gray-200 focus:outline-none focus:border-blue-400 transition-colors">
                    <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>

            <div class="p-4 md:p-0">
                <div id="stations-list-left" class="divide-y divide-gray-200">
                    <!-- Stations de la barre gauche -->
                </div>
            </div>
        </div>

        <!-- Overlay pour le menu mobile -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black opacity-50 z-30 hidden md:hidden"></div>

        <!-- Contenu principal -->
        <div class="flex-1">
            <div class="bg-white shadow-sm overflow-hidden border-x border-gray-100">
            <!-- Affichage de la station en cours -->
            <div id="now-playing" class="p-4 md:p-6 bg-gray-50 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div id="current-station-icon" class="w-16 h-16 bg-white overflow-hidden shadow-md flex items-center justify-center transform transition-transform duration-500">
                            <i class="fas fa-broadcast-tower text-2xl text-gray-500"></i>
                        </div>
                        <div id="station-info">
                            <h2 id="station-name" class="text-2xl font-bold text-gray-800">Sélectionnez une station</h2>
                            <p id="song-info" class="text-gray-600">Aucune lecture en cours</p>
                        </div>
                    </div>
                    <div id="equalizer" class="flex items-end h-12 space-x-1">
                        <!-- Les barres de l'égaliseur seront ajoutées dynamiquement -->
                    </div>
                </div>
            </div>

            <!-- Contrôles -->
            <div class="p-6 border-t border-gray-200">
                <div class="flex items-center justify-center space-x-6 mb-6">
                    <button id="prev-btn" class="text-gray-400 hover:text-gray-600" title="Précédent">
                        <i class="fas fa-step-backward text-2xl"></i>
                    </button>
                    <button id="play-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full w-16 h-16 title="Lecture">
                        <i class="fas fa-play text-2xl"></i>
                    </button>
                    <button id="next-btn" class="text-gray-400 hover:text-gray-600" title="Suivant">
                        <i class="fas fa-step-forward text-2xl"></i>
                    </button>
                </div>

                <!-- Barre de progression -->
                <div class="mb-6">
                    <div class="flex justify-between text-sm text-gray-400 mb-1">
                        <span id="current-time">00:00</span>
                        <span id="duration">--:--</span>
                    </div>
                    <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-blue-500 w-0"></div>
                    </div>
                </div>

                <!-- Contrôle du volume -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4 flex-1">
                        <i class="fas fa-volume-up text-gray-400"></i>
                        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <button id="theme-toggle" class="ml-4 p-2 rounded-full hover:bg-gray-100 transition-colors">
                        <i class="fas fa-moon text-gray-600"></i>
                    </button>
                </div>
            </div>

            <!-- Section des favoris -->
            <div class="border-t border-gray-200 bg-gray-50">
                <h3 class="px-6 py-4 text-lg font-semibold">Vos Favoris</h3>
                <div id="favorites-list" class="px-6 pb-4 flex flex-wrap gap-4">
                    <!-- Les favoris seront ajoutés dynamiquement -->
                </div>
            </div>

            <!-- Liste des stations -->
            <div class="border-t border-gray-200">
                <div id="stations-list" class="divide-y divide-gray-100">
                    <!-- Les stations seront ajoutées dynamiquement -->
                </div>
            </div>

            <!-- Formulaire d'inscription -->
            <div class="border-t border-gray-200 bg-gray-50 p-6">
                <div class="max-w-md mx-auto">
                    <h3 class="text-lg font-semibold mb-6 text-center">Inscrivez-vous pour plus de fonctionnalités</h3>
                    <form id="signup-form" class="space-y-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
                            <input type="text" id="name" name="name" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-transparent">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-transparent">
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                            <input type="password" id="password" name="password" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-transparent">
                        </div>
                        <div>
                            <button type="submit" 
                                class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition-colors">
                                S'inscrire
                            </button>
                        </div>
                        <p class="text-center text-sm text-gray-500">
                            En vous inscrivant, vous acceptez nos conditions d'utilisation et notre politique de confidentialité
                        </p>
                    </form>
                </div>
            </div>
            </div>
        </div>

        <!-- Barre latérale droite -->
        <div class="w-96 bg-white border-l border-gray-200 overflow-y-auto">
            <div id="stations-list-right" class="divide-y divide-gray-200">
                <!-- Stations de la barre droite -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
